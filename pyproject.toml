[project]
name = "mf-portfolio"
version = "0.1.0"
description = "Mutual fund portfolio simulator: SIP, lumpsum, XIRR, backtest with real NAV"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "plotly>=7.1",
    "requests>=2.34",
    "streamlit>=1.67",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
